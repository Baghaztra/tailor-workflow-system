spring.application.name=tailorworkflow

spring.config.import=optional:file:.env[.properties]

server.port=8081

app.cors.allowed-origins=http://localhost:8082

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-hours=8
app.auth.max-attempts=5
app.auth.window-minutes=15
app.cookie.secure=${AUTH_COOKIE_SECURE:false}

springdoc.swagger-ui.path=/docs

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=jdbc:postgresql://localhost:5432/tailor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
